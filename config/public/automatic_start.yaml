mrs_uav_autostart:

  # Countdown between the UAV entering offboard and the takeoff being triggered.
  # While it is counting down, the takeoff can be aborted by switching off the offboard mode.
  takeoff_countdown: 5.0 # [s]

  # MANUAL (PX4 flies the UAV without offboard) pauses automatic start with control output OFF.
  # Shorter than this, it is treated as an aborted OFFBOARD on the ground (the pilot lowered the sticks and PX4
  # detected the landing): automatic start resumes. Longer, it is a real flight: disarm and arm again to start over.
  manual_abort_max_duration: 5.0 # [s]

  # true: trigger the takeoff (uav_manager/takeoff) once the countdown elapses
  # false: perform all checks and enable control output, but leave calling
  #        uav_manager/takeoff to someone else
  trigger_takeoff: true
