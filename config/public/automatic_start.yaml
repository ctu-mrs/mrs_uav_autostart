mrs_uav_autostart:

  # Countdown between the UAV entering offboard and the takeoff being triggered.
  # While it is counting down, the takeoff can be aborted by switching off the offboard mode.
  takeoff_countdown: 5.0 # [s]

  # MANUAL (a pilot or the autopilot flies the UAV without offboard) pauses automatic start with control output
  # OFF. Shorter than this, it is treated as an aborted OFFBOARD on the ground (the pilot lowered the sticks and
  # PX4 detected the landing): automatic start resumes. Longer, it is a real flight: the pilot must disarm and arm
  # again to start over.
  manual_resume_timeout: 5.0 # [s]

  # true: trigger the takeoff (uav_manager/takeoff) once the countdown elapses
  # false: perform all checks and enable control output, but leave calling
  #        uav_manager/takeoff to someone else
  trigger_takeoff: true

  # true: when control output can't be turned ON within arm_to_output_timeout right after the pilot armed, disarm
  #       the UAV and finish
  # false: never disarm, the pilot must disarm and arm again (the autopilot's pre-takeoff auto-disarm covers a UAV
  #        left on the ground)
  disarm_on_output_timeout: true
